<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>Lists</h1>
    <div>
      <div>About me</div>
      <div>My name is <b>Maksim.</b></div>
      <div>(unsorted) My hobbies:</div>
      <ul>
        <li>play games</li>
        <li>study Korean</li>
        <li>study programming</li>
      </ul>
    </div>
    <br /><br /><br /><br /><br />
    <div>
      <div>(sorted) <u>Names of student:</u></div>
      <ol>
        <li>Aleksey</li>
        <li>Mikhail</li>
        <li>Nikita</li>
        <li>Svetlana</li>
        <li>Diana</li>
      </ol>
    </div>
    <br /><br /><br /><br /><br />
    <div>
      <div>(for terms) <i>Terms</i></div>
      <dl>
        <dt>HTML</dt>
        <dd>- Hyper Text Markup Language</dd>
        <dt>CSS</dt>
        <dd>- Cascade Style Sheets</dd>
      </dl>
    </div>
</body>
</html>
